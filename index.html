<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 범박고등학교 독서활동 기록 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .hidden { display: none !important; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: bold; }
        .tab-inactive { color: #6b7280; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- 로그인 및 회원가입 화면 -->
    <div id="auth-screen" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">범박고 독서활동 기록</h1>
            
            <div class="flex mb-4">
                <button id="btn-show-login" class="flex-1 py-2 text-center tab-active" onclick="toggleAuthMode('login')">로그인</button>
                <button id="btn-show-register" class="flex-1 py-2 text-center tab-inactive" onclick="toggleAuthMode('register')">회원가입</button>
            </div>

            <div class="mb-4 flex gap-4 justify-center">
                <label class="cursor-pointer"><input type="radio" name="role" value="student" checked onchange="toggleRoleFields()"> 학생</label>
                <label class="cursor-pointer"><input type="radio" name="role" value="teacher" onchange="toggleRoleFields()"> 교사</label>
            </div>

            <div id="student-fields">
                <div class="flex gap-2 mb-3">
                    <input type="number" id="grade" placeholder="학년" class="w-1/3 border p-2 rounded" min="1" max="3">
                    <input type="number" id="classNum" placeholder="반" class="w-1/3 border p-2 rounded" min="1" max="15">
                    <input type="number" id="studentNum" placeholder="번호" class="w-1/3 border p-2 rounded" min="1" max="40">
                </div>
            </div>

            <input type="text" id="userName" placeholder="이름" class="w-full border p-2 rounded mb-3">
            <input type="text" id="phone" placeholder="핸드폰 번호 (가입시에만)" class="w-full border p-2 rounded mb-3 hidden">
            <input type="password" id="password" placeholder="비밀번호 (4자리 숫자)" class="w-full border p-2 rounded mb-4" maxlength="4">

            <button id="btn-action" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 font-bold" onclick="handleAuth()">로그인</button>
            <p id="auth-message" class="text-red-500 text-sm mt-2 text-center"></p>
        </div>
    </div>

    <!-- 학생 화면 -->
    <div id="student-screen" class="hidden max-w-4xl mx-auto p-4">
        <header class="flex justify-between items-center mb-6 py-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">독서활동 기록 시스템 (학생용)</h1>
            <button onclick="logout()" class="text-sm bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">로그아웃</button>
        </header>

        <div class="flex mb-6 border-b">
            <button id="tab-write" class="px-4 py-2 tab-active" onclick="switchStudentTab('write')">독서 감상문 입력</button>
            <button id="tab-records" class="px-4 py-2 tab-inactive" onclick="switchStudentTab('records'); loadStudentRecords();">학교생활기록부용 기록</button>
        </div>

        <div id="write-section">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <input type="text" id="bookTitle" placeholder="책 제목" class="w-full border p-2 rounded mb-4">
                <input type="text" id="bookAuthor" placeholder="저자명" class="w-full border p-2 rounded mb-4">
                <div class="mb-4 text-gray-600 text-sm">독서 활동 기록일: <span id="currentDate"></span></div>
                <textarea id="bookReview" placeholder="독서 감상 기록을 입력하세요 (느낀 점, 알게 된 점 등)" class="w-full border p-2 rounded mb-4 h-40"></textarea>
                <button onclick="submitReview()" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600 font-bold">제출 및 생기부 문구 생성</button>
                <p id="loading-msg" class="text-blue-500 text-sm mt-2 hidden text-center">AI가 문구를 생성하고 저장 중입니다...</p>
            </div>
        </div>

        <div id="records-section" class="hidden">
            <div id="student-records-list" class="space-y-4">
                <!-- 기록들이 여기에 추가됨 -->
            </div>
        </div>
    </div>

    <!-- 교사 화면 -->
    <div id="teacher-screen" class="hidden max-w-6xl mx-auto p-4">
        <header class="flex justify-between items-center mb-6 py-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">독서활동 누적 기록 (교사용)</h1>
            <div class="space-x-2">
                <button onclick="exportToExcel()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">엑셀 다운로드</button>
                <button onclick="logout()" class="text-sm bg-gray-200 px-3 py-2 rounded hover:bg-gray-300">로그아웃</button>
            </div>
        </header>

        <div class="bg-white rounded-lg shadow-md overflow-x-auto">
            <table class="w-full text-left border-collapse" id="teacher-table">
                <thead>
                    <tr class="bg-gray-100 border-b">
                        <th class="p-3">학년</th>
                        <th class="p-3">반</th>
                        <th class="p-3">번호</th>
                        <th class="p-3">이름</th>
                        <th class="p-3">책제목 (저자)</th>
                        <th class="p-3">생기부 기재 문구</th>
                        <th class="p-3">작성일</th>
                    </tr>
                </thead>
                <tbody id="teacher-records-body">
                    <!-- 데이터가 여기에 추가됨 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase 및 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkLu2HQI1odTeSlNTEmBeaiRpMWZwrjzg",
            authDomain: "rarara2026-c695f.firebaseapp.com",
            projectId: "rarara2026-c695f",
            storageBucket: "rarara2026-c695f.firebasestorage.app",
            messagingSenderId: "1080651985073",
            appId: "1:1080651985073:web:d32319ab4b92968db57290"
        };

        const GEMINI_API_KEY = "AQ.Ab8RN6IxheojziufhIN5cNoXcW0AF-HMojgFD-DKkMxYLZya5w";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserInfo = null;
        let authMode = 'login'; 

        window.toggleAuthMode = (mode) => {
            authMode = mode;
            document.getElementById('btn-show-login').className = `flex-1 py-2 text-center ${mode === 'login' ? 'tab-active' : 'tab-inactive'}`;
            document.getElementById('btn-show-register').className = `flex-1 py-2 text-center ${mode === 'register' ? 'tab-active' : 'tab-inactive'}`;
            document.getElementById('phone').classList.toggle('hidden', mode === 'login');
            document.getElementById('btn-action').innerText = mode === 'login' ? '로그인' : '회원가입';
        };

        window.toggleRoleFields = () => {
            const isStudent = document.querySelector('input[name="role"]:checked').value === 'student';
            document.getElementById('student-fields').style.display = isStudent ? 'block' : 'none';
        };

        window.handleAuth = async () => {
            const role = document.querySelector('input[name="role"]:checked').value;
            const name = document.getElementById('userName').value.trim();
            const pw = document.getElementById('password').value.trim();
            const msg = document.getElementById('auth-message');

            if (!name || pw.length !== 4) {
                msg.innerText = "이름과 4자리 비밀번호를 정확히 입력하세요.";
                return;
            }

            let userId = `${role}_${name}_${pw}`;
            let userInfo = { role, name, pw };

            if (role === 'student') {
                const g = document.getElementById('grade').value;
                const c = document.getElementById('classNum').value;
                const s = document.getElementById('studentNum').value;
                if (!g || !c || !s) {
                    msg.innerText = "학년, 반, 번호를 입력하세요.";
                    return;
                }
                userId = `${role}_${g}_${c}_${s}_${name}_${pw}`;
                userInfo = { ...userInfo, grade: g, classNum: c, studentNum: s };
            }

            try {
                if (authMode === 'register') {
                    const phone = document.getElementById('phone').value.trim();
                    if (!phone) { msg.innerText = "핸드폰 번호를 입력하세요."; return; }
                    userInfo.phone = phone;
                    
                    await addDoc(collection(db, "users"), { userId, ...userInfo });
                    alert("회원가입 완료! 로그인 해주세요.");
                    toggleAuthMode('login');
                } else {
                    const q = query(collection(db, "users"));
                    const querySnapshot = await getDocs(q);
                    let found = false;
                    querySnapshot.forEach((doc) => {
                        if (doc.data().userId === userId) found = true;
                    });

                    if (found) {
                        await signInAnonymously(auth);
                        currentUserInfo = userInfo;
                        showMainScreen();
                    } else {
                        msg.innerText = "정보가 일치하지 않거나 가입되지 않은 사용자입니다.";
                    }
                }
            } catch (error) {
                msg.innerText = "서버 오류가 발생했습니다.";
                console.error(error);
            }
        };

        function showMainScreen() {
            document.getElementById('auth-screen').classList.add('hidden');
            if (currentUserInfo.role === 'student') {
                document.getElementById('student-screen').classList.remove('hidden');
                const now = new Date();
                document.getElementById('currentDate').innerText = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;
            } else {
                document.getElementById('teacher-screen').classList.remove('hidden');
                loadTeacherRecords();
            }
        }

        window.logout = () => {
            currentUserInfo = null;
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('student-screen').classList.add('hidden');
            document.getElementById('teacher-screen').classList.add('hidden');
            document.getElementById('userName').value = '';
            document.getElementById('password').value = '';
        };

        window.switchStudentTab = (tab) => {
            document.getElementById('tab-write').className = `px-4 py-2 ${tab === 'write' ? 'tab-active' : 'tab-inactive'}`;
            document.getElementById('tab-records').className = `px-4 py-2 ${tab === 'records' ? 'tab-active' : 'tab-inactive'}`;
            document.getElementById('write-section').classList.toggle('hidden', tab !== 'write');
            document.getElementById('records-section').classList.toggle('hidden', tab !== 'records');
        };

        async function generateAIReview(title, author, reviewText) {
            const prompt = `학생이 작성한 독서감상문을 바탕으로 학교생활기록부 교과세부능력 및 특기사항에 기재할 문구를 1개 자동 생성해줘. 분량은 띄어쓰기 포함 100~150자. 서술어는 '~함', '~소감을 말함' 등으로 끝내줘. \n예시: 코스모스(칼 세이건)을 읽고, 끝없는 우주의 크기 앞에 인간이 얼마나 나약하고 작은 존재인지 깨닫는 동시에, 그 광활한 우주를 탐구하고 이해할 수 있는 이성을 가진 유일한 존재라는 점에서 깊은 위로와 특별함을 느꼈다는 소감을 말함.\n\n[책제목]: ${title}\n[저자명]: ${author}\n[독서감상기록]: ${reviewText}`;
            
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            return data.candidates[0].content.parts[0].text.trim();
        }

        window.submitReview = async () => {
            const title = document.getElementById('bookTitle').value.trim();
            const author = document.getElementById('bookAuthor').value.trim();
            const review = document.getElementById('bookReview').value.trim();
            const msgObj = document.getElementById('loading-msg');

            if (!title || !author || !review) {
                alert("모든 항목을 입력해주세요.");
                return;
            }

            msgObj.classList.remove('hidden');
            try {
                const aiSummary = await generateAIReview(title, author, review);
                
                await addDoc(collection(db, "reviews"), {
                    grade: currentUserInfo.grade,
                    classNum: currentUserInfo.classNum,
                    studentNum: currentUserInfo.studentNum,
                    name: currentUserInfo.name,
                    bookTitle: title,
                    bookAuthor: author,
                    originalReview: review,
                    aiSummary: aiSummary,
                    createdAt: serverTimestamp()
                });

                alert("성공적으로 저장되었습니다.");
                document.getElementById('bookTitle').value = '';
                document.getElementById('bookAuthor').value = '';
                document.getElementById('bookReview').value = '';
                switchStudentTab('records');
                loadStudentRecords();
            } catch (error) {
                alert("문구 생성 또는 저장 중 오류가 발생했습니다.");
                console.error(error);
            } finally {
                msgObj.classList.add('hidden');
            }
        };

        window.loadStudentRecords = async () => {
            const listObj = document.getElementById('student-records-list');
            listObj.innerHTML = '<p>로딩 중...</p>';
            
            const q = query(collection(db, "reviews"), orderBy("createdAt", "desc"));
            const querySnapshot = await getDocs(q);
            
            let html = '';
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.name === currentUserInfo.name && data.grade === currentUserInfo.grade) {
                    const dateStr = data.createdAt ? data.createdAt.toDate().toLocaleDateString() : '방금 전';
                    html += `
                    <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                        <div class="flex justify-between text-sm text-gray-500 mb-2">
                            <span class="font-bold text-black">${data.bookTitle} (${data.bookAuthor})</span>
                            <span>${dateStr}</span>
                        </div>
                        <p class="text-gray-800 leading-relaxed">${data.aiSummary}</p>
                    </div>`;
                }
            });
            listObj.innerHTML = html || '<p>작성된 기록이 없습니다.</p>';
        };

        window.loadTeacherRecords = async () => {
            const tbody = document.getElementById('teacher-records-body');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4">로딩 중...</td></tr>';
            
            const q = query(collection(db, "reviews"), orderBy("createdAt", "desc"));
            const querySnapshot = await getDocs(q);
            
            let html = '';
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const dateStr = data.createdAt ? data.createdAt.toDate().toLocaleDateString() : '방금 전';
                html += `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3">${data.grade}</td>
                    <td class="p-3">${data.classNum}</td>
                    <td class="p-3">${data.studentNum}</td>
                    <td class="p-3">${data.name}</td>
                    <td class="p-3">${data.bookTitle} (${data.bookAuthor})</td>
                    <td class="p-3 text-sm">${data.aiSummary}</td>
                    <td class="p-3">${dateStr}</td>
                </tr>`;
            });
            tbody.innerHTML = html || '<tr><td colspan="7" class="text-center p-4">기록이 없습니다.</td></tr>';
        };

        window.exportToExcel = () => {
            const table = document.getElementById("teacher-table");
            const wb = XLSX.utils.table_to_book(table, { sheet: "독서활동기록" });
            XLSX.writeFile(wb, "독서활동기록.xlsx");
        };
    </script>
</body>
</html>
